server {
    listen 80;

    # launcher.js and apps.json keep a stable URL (every sub-app references
    # them by path), so they must never be cached as immutable: `no-cache`
    # makes browsers revalidate with the ETag on each load, and a new app in
    # apps.json shows up everywhere as soon as this image is redeployed.
    location /launcher/ {
        alias /usr/share/nginx/html/launcher/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        gzip on;
        gzip_types application/javascript application/json;
    }
}
