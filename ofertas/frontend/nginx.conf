server {
    listen 80;

    location /ofertas/api/ {
        proxy_pass http://ofertas-backend:3006/ofertas/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ofertas/ {
        alias /usr/share/nginx/html/ofertas/;
        try_files $uri $uri/ /ofertas/index.html;
    }
}
