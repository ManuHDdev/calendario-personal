networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  ofertas-db:
    image: postgres:15
    container_name: ofertas-db
    environment:
      POSTGRES_DB:       ${OFERTAS_DB_NAME}
      POSTGRES_USER:     ${OFERTAS_DB_USER}
      POSTGRES_PASSWORD: ${OFERTAS_DB_PASSWORD}
    volumes:
      - ofertas_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OFERTAS_DB_USER} -d ${OFERTAS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calendario-net

  ofertas-backend:
    image: ghcr.io/manuhddev/ofertas-backend:latest
    container_name: ofertas-backend
    environment:
      PORT:                3006
      OFERTAS_DB_HOST:     ofertas-db
      OFERTAS_DB_NAME:     ${OFERTAS_DB_NAME}
      OFERTAS_DB_USER:     ${OFERTAS_DB_USER}
      OFERTAS_DB_PASSWORD: ${OFERTAS_DB_PASSWORD}
      KEYCLOAK_CERTS_URL:  ${KEYCLOAK_CERTS_URL}
      CORS_ORIGIN:         ${CORS_ORIGIN}
      SCRAPER_API_KEY:     ${SCRAPER_API_KEY}
      NODE_ENV:            production
    depends_on:
      ofertas-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/ofertas/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - calendario-net

  ofertas-frontend:
    image: ghcr.io/manuhddev/ofertas-frontend:latest
    container_name: ofertas-frontend
    depends_on:
      - ofertas-backend
    restart: unless-stopped
    networks:
      - calendario-net

volumes:
  ofertas_pgdata:
