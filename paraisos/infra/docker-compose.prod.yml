networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  paraisos-db:
    image: postgres:15
    container_name: paraisos-db
    environment:
      POSTGRES_DB:       ${PARAISOS_DB_NAME}
      POSTGRES_USER:     ${PARAISOS_DB_USER}
      POSTGRES_PASSWORD: ${PARAISOS_DB_PASSWORD}
    volumes:
      - paraisos_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARAISOS_DB_USER} -d ${PARAISOS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calendario-net

  paraisos-backend:
    image: ghcr.io/manuhddev/paraisos-backend:latest
    container_name: paraisos-backend
    environment:
      PORT:                 3007
      PARAISOS_DB_HOST:     paraisos-db
      PARAISOS_DB_NAME:     ${PARAISOS_DB_NAME}
      PARAISOS_DB_USER:     ${PARAISOS_DB_USER}
      PARAISOS_DB_PASSWORD: ${PARAISOS_DB_PASSWORD}
      KEYCLOAK_CERTS_URL:   ${KEYCLOAK_CERTS_URL}
      CORS_ORIGIN:          ${CORS_ORIGIN}
      PARAISOS_IMAGES_PATH: /app/data/images
      ORS_API_KEY:          ${ORS_API_KEY}
      NODE_ENV:             production
    volumes:
      - paraisos_images:/app/data/images
    depends_on:
      paraisos-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3007/paraisos/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - calendario-net

  paraisos-frontend:
    image: ghcr.io/manuhddev/paraisos-frontend:latest
    container_name: paraisos-frontend
    depends_on:
      - paraisos-backend
    restart: unless-stopped
    networks:
      - calendario-net

volumes:
  paraisos_pgdata:
  paraisos_images:
