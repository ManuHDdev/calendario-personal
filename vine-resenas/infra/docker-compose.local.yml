services:
  vine-resenas-db:
    image: postgres:15
    container_name: vine-resenas-db-local
    ports:
      - "5447:5432"
    environment:
      POSTGRES_DB: vine_resenas
      POSTGRES_USER: vine_resenas
      POSTGRES_PASSWORD: vine_resenas123
    volumes:
      - vine_resenas_local_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vine_resenas -d vine_resenas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  vine_resenas_local_data:
