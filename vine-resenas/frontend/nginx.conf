server {
    listen 80;

    # Photos up to 25 MB and videos up to 200 MB (plus multipart overhead).
    client_max_body_size 250m;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://vine-resenas-backend:3018;

    location /vine-resenas/api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream big uploads straight to the backend and allow slow mobile links.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /vine-resenas/ {
        alias /usr/share/nginx/html/vine-resenas/;
        try_files $uri $uri/ /vine-resenas/index.html;
    }
}
