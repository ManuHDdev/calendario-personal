server {
    listen 80;

    # Photos up to 25 MB and videos up to 1 GB (plus multipart overhead, hence 1100m).
    client_max_body_size 1100m;
    # Max gap between two reads of the request body (not the total time): slow mobile uplinks.
    client_body_timeout 600s;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://vine-resenas-backend:3018;

    location /vine-resenas/api/ {
        proxy_pass $backend_upstream;
        # Media URLs carry the JWT in ?token=; keep it out of the access log.
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream big uploads straight to the backend and allow slow mobile links.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Public guest page: the link secret is part of the path, so keep it out of the access log. The SPA is
    # served in place (rewrite ... break) instead of try_files, whose internal redirect would land in the
    # logged location below.
    location /vine-resenas/c/ {
        access_log off;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        rewrite ^ /vine-resenas/index.html break;
    }

    location /vine-resenas/ {
        alias /usr/share/nginx/html/vine-resenas/;
        try_files $uri $uri/ /vine-resenas/index.html;
    }
}
