server {
    listen 80;

    location /finanzas/api/ {
        proxy_pass http://finanzas-backend:3014/finanzas/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /finanzas/ {
        alias /usr/share/nginx/html/finanzas/;
        try_files $uri $uri/ /finanzas/index.html;
    }
}
