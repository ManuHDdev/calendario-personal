networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  finanzas-db:
    image: postgres:15
    container_name: finanzas-db
    environment:
      POSTGRES_DB:       ${FINANZAS_DB_NAME}
      POSTGRES_USER:     ${FINANZAS_DB_USER}
      POSTGRES_PASSWORD: ${FINANZAS_DB_PASSWORD}
    volumes:
      - finanzas_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FINANZAS_DB_USER} -d ${FINANZAS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calendario-net

  finanzas-backend:
    image: ghcr.io/manuhddev/finanzas-backend:latest
    container_name: finanzas-backend
    environment:
      PORT:                                   3014
      FINANZAS_DB_HOST:                       finanzas-db
      FINANZAS_DB_NAME:                       ${FINANZAS_DB_NAME}
      FINANZAS_DB_USER:                       ${FINANZAS_DB_USER}
      FINANZAS_DB_PASSWORD:                   ${FINANZAS_DB_PASSWORD}
      KEYCLOAK_CERTS_URL:                     ${KEYCLOAK_CERTS_URL}
      CORS_ORIGIN:                            ${CORS_ORIGIN}
      FINANZAS_INTERVALO_IMPORTACION_HORAS:   ${FINANZAS_INTERVALO_IMPORTACION_HORAS:-24}
      NODE_ENV:                               production
    depends_on:
      finanzas-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3014/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - calendario-net

  finanzas-frontend:
    image: ghcr.io/manuhddev/finanzas-frontend:latest
    container_name: finanzas-frontend
    depends_on:
      - finanzas-backend
    restart: unless-stopped
    networks:
      - calendario-net

volumes:
  finanzas_pgdata:
