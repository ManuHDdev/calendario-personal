name: elbunkerdelingeniero

networks:
  calendario-network:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: infra_postgres_data
  sonarqube_data:
  uploads_data:

services:
  postgres:
    image: postgres:15
    container_name: calendario-postgres
    networks:
      - calendario-network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: calendario
      POSTGRES_USER: ${POSTGRES_USER:-calendariodb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendariodb123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendariodb} -d calendario"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: calendario-keycloak
    networks:
      - calendario-network
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/calendario
      KC_DB_USERNAME: ${POSTGRES_USER:-calendariodb}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-calendariodb123}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: calendario-backend
    networks:
      - calendario-network
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/calendario
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/calendario
      UPLOADS_DIR: /app/uploads
      UPLOADS_BASE_URL: http://localhost:8081/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ../calendario-frontend
      dockerfile: Dockerfile
    container_name: calendario-frontend
    networks:
      - calendario-network
    ports:
      - "4200:80"
    depends_on:
      - backend

  sonarqube:
    image: sonarqube:community
    container_name: calendario-sonarqube
    networks:
      - calendario-network
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/calendario
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    depends_on:
      postgres:
        condition: service_healthy
