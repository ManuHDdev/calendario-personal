services:
  watchlist-db:
    image: postgres:15
    container_name: watchlist-db-local
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: watchlist
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist123
    volumes:
      - watchlist_local_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist -d watchlist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  watchlist_local_data:
