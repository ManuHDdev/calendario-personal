networks:
  calendario-net:
    external: true
    name: calendario-net

volumes:
  descargas-thumbs:

services:
  descargas-backend:
    image: ghcr.io/manuhddev/descargas-backend:latest
    container_name: descargas-backend
    restart: unless-stopped
    networks:
      - calendario-net
    environment:
      PORT: 3016
      DOWNLOADS_ROOT: /data
      KEYCLOAK_CERTS_URL: http://calendario-keycloak:8080/keycloak/realms/calendario/protocol/openid-connect/certs
      CORS_ORIGIN: https://elbunkerdelingeniero.duckdns.org
      NODE_ENV: production
      THUMB_CACHE_DIR: /cache
    volumes:
      # Host folder -> container, READ-WRITE: admin/descargas_admin can delete
      # files through POST /delete (permanent, no trash). The container runs as
      # root (the image sets no USER), so it can remove files owned by host user
      # `manu`. Host path is overridable via DESCARGAS_HOST_PATH (e.g. in
      # ~/descargas/.env); no .env is required.
      - ${DESCARGAS_HOST_PATH:-/home/manu/rat_downloads}:/data
      # Generated thumbnails (the only writable path). Disposable: deleting the
      # volume just makes them regenerate on demand.
      - descargas-thumbs:/cache
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3016/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  descargas-frontend:
    image: ghcr.io/manuhddev/descargas-frontend:latest
    container_name: descargas-frontend
    restart: unless-stopped
    networks:
      - calendario-net
    depends_on:
      - descargas-backend
