server {
    listen 80;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://descargas-backend:3016;

    location /descargas/api/ {
        proxy_pass $backend_upstream;
        # Large media: stream straight through (Range requests pass untouched).
        proxy_buffering off;
        proxy_read_timeout 300s;
        # The media URLs carry the access token in the query string.
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /descargas/ {
        alias /usr/share/nginx/html/descargas/;
        try_files $uri $uri/ /descargas/index.html;
    }
}
