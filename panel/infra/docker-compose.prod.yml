networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  panel-backend:
    image: ghcr.io/manuhddev/panel-backend:latest
    container_name: panel-backend
    restart: unless-stopped
    networks:
      - calendario-net
    environment:
      KEYCLOAK_CERTS_URL: http://calendario-keycloak:8080/keycloak/realms/calendario/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://calendario-keycloak:8080/keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      CORS_ORIGIN: https://elbunkerdelingeniero.duckdns.org
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/panel/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  panel-frontend:
    image: ghcr.io/manuhddev/panel-frontend:latest
    container_name: panel-frontend
    restart: unless-stopped
    networks:
      - calendario-net
    depends_on:
      - panel-backend
