server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    large_client_header_buffers 4 32k;
    client_header_buffer_size 4k;

    # Ruta base /mapacyd/ — misma raíz, SPA fallback a /mapacyd/index.html
    location /mapacyd/ {
        try_files $uri $uri/ /mapacyd/index.html;
    }

    # API hacia el backend
    location /mapacyd/api/ {
        proxy_pass http://mapacyd-backend:3003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/wasm;

    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
