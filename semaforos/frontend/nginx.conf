server {
    listen 80;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://semaforos-backend:3017;

    location /semaforos/api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Importar una ciudad consulta Overpass y puede tardar: mas margen que
        # los 60 s por defecto de nginx.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /semaforos/ {
        alias /usr/share/nginx/html/semaforos/;
        try_files $uri $uri/ /semaforos/index.html;
    }
}
