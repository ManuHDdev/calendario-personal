# ─────────────────────────────────────────────────────────────────────────────
# semaforos — Base de datos PostgreSQL para desarrollo local
# Puerto expuesto: 5445 en localhost (siguiente libre tras el de mensajeria :5444)
# El backend se conecta via localhost:5445, no necesita red compartida.
#   cd semaforos/infra && docker compose -f docker-compose.local.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  semaforos-db:
    image: postgres:15
    container_name: semaforos-db-local
    ports:
      - "5445:5432"
    environment:
      POSTGRES_DB: semaforos
      POSTGRES_USER: semaforos
      POSTGRES_PASSWORD: semaforos123
    volumes:
      - semaforos_local_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaforos -d semaforos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  semaforos_local_data:
