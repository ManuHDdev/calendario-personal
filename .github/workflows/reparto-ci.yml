name: CI/CD Reparto

on:
  push:
    branches:
      - main
    paths:
      - 'reparto/**'
      - '.github/workflows/reparto-ci.yml'

jobs:
  lint-and-build-backend:
    name: Reparto · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: reparto/backend
        run: npm install && npm run build

      - name: Test
        working-directory: reparto/backend
        run: npm test

  lint-and-build-frontend:
    name: Reparto · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: reparto/frontend
        run: npm ci && npm run build

  docker-build-and-push:
    name: Reparto · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push reparto-backend
        uses: docker/build-push-action@v5
        with:
          context: ./reparto/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/reparto-backend:latest
            ghcr.io/${{ env.OWNER }}/reparto-backend:${{ github.sha }}

      - name: Build & push reparto-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./reparto/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/reparto-frontend:latest
            ghcr.io/${{ env.OWNER }}/reparto-frontend:${{ github.sha }}

  deploy:
    name: Deploy · Reparto VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose e init.sql al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "reparto/infra/docker-compose.prod.yml,reparto/infra/init.sql"
          target: /home/manu/reparto
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/reparto

            docker compose -f docker-compose.prod.yml pull reparto-backend reparto-frontend
            docker compose -f docker-compose.prod.yml up -d reparto-db reparto-backend reparto-frontend
            docker compose -f docker-compose.prod.yml ps
