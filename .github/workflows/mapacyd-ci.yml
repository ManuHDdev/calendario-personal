name: CI/CD Mapacyd

on:
  push:
    branches:
      - main
    paths:
      - 'mapacyd/**'
      - '.github/workflows/mapacyd-ci.yml'

jobs:
  # ─── 1. Build backend ────────────────────────────────────────────────────────
  lint-and-build-backend:
    name: Mapacyd · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: mapacyd/backend
        run: npm ci && npm run build

  # ─── 2. Build frontend ───────────────────────────────────────────────────────
  lint-and-build-frontend:
    name: Mapacyd · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: mapacyd/frontend
        run: npm ci && npm run build

  # ─── 3. Docker build & push to GHCR ─────────────────────────────────────────
  docker-build-and-push:
    name: Mapacyd · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push mapacyd-backend
        uses: docker/build-push-action@v5
        with:
          context: ./mapacyd/backend
          push: true
          tags: ghcr.io/manuhddev/mapacyd-backend:latest

      - name: Build & push mapacyd-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./mapacyd/frontend
          push: true
          tags: ghcr.io/manuhddev/mapacyd-frontend:latest

  # ─── 4. Deploy al VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy · Mapacyd VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "mapacyd/infra/docker-compose.prod.yml"
          target: /home/manu/mapacyd
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/mapacyd

            docker compose -f docker-compose.prod.yml pull mapacyd-backend mapacyd-frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps mapacyd-backend mapacyd-frontend
            docker compose -f docker-compose.prod.yml ps
