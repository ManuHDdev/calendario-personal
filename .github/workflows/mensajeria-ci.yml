name: CI/CD Mensajería

on:
  push:
    branches:
      - main
    paths:
      - 'mensajeria/**'
      - '.github/workflows/mensajeria-ci.yml'

jobs:
  # ─── 1. Build & test backend ────────────────────────────────────────────────
  lint-and-build-backend:
    name: Mensajería · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: mensajeria/backend
        run: npm ci

      # Los adaptadores mock nunca salen a la red — Twilio/SendGrid/el pool
      # de Postgres van mockeados (ver src/adapters/*.test.ts y
      # src/services/adapterFactory.test.ts) — CI no sale a internet.
      - name: Test
        working-directory: mensajeria/backend
        run: npm test

      - name: Build
        working-directory: mensajeria/backend
        run: npm run build

  # ─── 2. Build & test frontend ────────────────────────────────────────────────
  lint-and-build-frontend:
    name: Mensajería · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: mensajeria/frontend
        run: npm ci

      - name: Test
        working-directory: mensajeria/frontend
        run: npm test

      - name: Build
        working-directory: mensajeria/frontend
        run: npm run build

  # ─── 3. Docker build & push to GHCR ─────────────────────────────────────────
  docker-build-and-push:
    name: Mensajería · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push mensajeria-backend
        uses: docker/build-push-action@v5
        with:
          context: ./mensajeria/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/mensajeria-backend:latest
            ghcr.io/${{ env.OWNER }}/mensajeria-backend:${{ github.sha }}

      - name: Build & push mensajeria-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./mensajeria/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/mensajeria-frontend:latest
            ghcr.io/${{ env.OWNER }}/mensajeria-frontend:${{ github.sha }}

  # ─── 4. Deploy al VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy · Mensajería VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose e init.sql al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "mensajeria/infra/docker-compose.prod.yml,mensajeria/infra/init.sql"
          target: /home/manu/mensajeria
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/mensajeria

            docker compose -f docker-compose.prod.yml pull mensajeria-backend mensajeria-frontend
            docker compose -f docker-compose.prod.yml up -d mensajeria-db mensajeria-backend mensajeria-frontend
            docker compose -f docker-compose.prod.yml ps

            # El bloque `location /mensajeria/` de nginx vive en
            # nginx/calendario.conf y lo despliega el pipeline de Calendario
            # (.github/workflows/ci.yml), no este workflow — mismo patrón
            # que finanzas/gastos/ofertas/etc.
