name: CI/CD Watchlist

on:
  push:
    branches:
      - main
    paths:
      - 'watchlist/**'
      - '.github/workflows/watchlist-ci.yml'

jobs:
  lint-and-build-backend:
    name: Watchlist · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: watchlist/backend
        run: npm ci && npm run build

      - name: Test
        working-directory: watchlist/backend
        run: npm test

  lint-and-build-frontend:
    name: Watchlist · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: watchlist/frontend
        run: npm ci && npm run build

  docker-build-and-push:
    name: Watchlist · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push watchlist-backend
        uses: docker/build-push-action@v5
        with:
          context: ./watchlist/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/watchlist-backend:latest
            ghcr.io/${{ env.OWNER }}/watchlist-backend:${{ github.sha }}

      - name: Build & push watchlist-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./watchlist/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/watchlist-frontend:latest
            ghcr.io/${{ env.OWNER }}/watchlist-frontend:${{ github.sha }}

  deploy:
    name: Deploy · Watchlist VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose e init.sql al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "watchlist/infra/docker-compose.prod.yml,watchlist/infra/init.sql"
          target: /home/manu/watchlist
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/watchlist

            docker compose -f docker-compose.prod.yml pull watchlist-backend watchlist-frontend
            docker compose -f docker-compose.prod.yml up -d watchlist-db watchlist-backend watchlist-frontend
            docker compose -f docker-compose.prod.yml ps
