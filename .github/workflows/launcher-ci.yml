name: CI/CD Launcher

on:
  push:
    branches:
      - main
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-ci.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-ci.yml'

jobs:
  # ─── 1. Test ─────────────────────────────────────────────────────────────────
  # Unit tests of <bunker-launcher> plus validation of apps.json (schema,
  # unique ids/paths, safe SVG icons). No build step: public/ ships as-is.
  test:
    name: Launcher · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: launcher
        run: npm ci

      - name: Test
        working-directory: launcher
        run: npm test

  # ─── 2. Docker build & push to GHCR ─────────────────────────────────────────
  docker-build-and-push:
    name: Launcher · Docker build & push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push launcher
        uses: docker/build-push-action@v5
        with:
          context: ./launcher
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/launcher:latest
            ghcr.io/${{ env.OWNER }}/launcher:${{ github.sha }}

  # ─── 3. Deploy al VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy · Launcher VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "launcher/infra/docker-compose.prod.yml"
          target: /home/manu/launcher
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/launcher

            docker compose -f docker-compose.prod.yml pull launcher
            docker compose -f docker-compose.prod.yml up -d --no-deps launcher
            docker compose -f docker-compose.prod.yml ps

            # The `location /launcher/` block lives in nginx/calendario.conf and
            # is published by the Calendario pipeline (.github/workflows/ci.yml),
            # not by this workflow.
