name: CI/CD Descargas

on:
  push:
    branches:
      - main
    paths:
      - 'descargas/**'
      - '.github/workflows/descargas-ci.yml'

jobs:
  # ─── 1. Build & test backend ────────────────────────────────────────────────
  lint-and-build-backend:
    name: Descargas · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: descargas/backend
        run: npm ci

      # Los tests usan una carpeta temporal y JWTs firmados con una clave de
      # prueba (JWKS mockeado): CI no sale a internet.
      - name: Test
        working-directory: descargas/backend
        run: npm test

      - name: Build
        working-directory: descargas/backend
        run: npm run build

  # ─── 2. Build & test frontend ────────────────────────────────────────────────
  lint-and-build-frontend:
    name: Descargas · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: descargas/frontend
        run: npm ci

      - name: Test
        working-directory: descargas/frontend
        run: npm test

      - name: Build
        working-directory: descargas/frontend
        run: npm run build

  # ─── 3. Docker build & push to GHCR ─────────────────────────────────────────
  docker-build-and-push:
    name: Descargas · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push descargas-backend
        uses: docker/build-push-action@v5
        with:
          context: ./descargas/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/descargas-backend:latest
            ghcr.io/${{ env.OWNER }}/descargas-backend:${{ github.sha }}

      - name: Build & push descargas-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./descargas/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/descargas-frontend:latest
            ghcr.io/${{ env.OWNER }}/descargas-frontend:${{ github.sha }}

  # ─── 4. Deploy al VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy · Descargas VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "descargas/infra/docker-compose.prod.yml"
          target: /home/manu/descargas
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/descargas

            docker compose -f docker-compose.prod.yml pull descargas-backend descargas-frontend
            docker compose -f docker-compose.prod.yml up -d descargas-backend descargas-frontend
            docker compose -f docker-compose.prod.yml ps

            # El bloque `location /descargas/` de nginx vive en
            # nginx/calendario.conf y lo despliega el pipeline de Calendario
            # (.github/workflows/ci.yml), no este workflow — mismo patrón
            # que finanzas/gastos/ofertas/etc.
