name: CI/CD Panel

on:
  push:
    paths:
      - 'panel/**'
      - '.github/workflows/panel-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'panel/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─── Build & Push ────────────────────────────────────────────────────────────
  build-and-push:
    name: Panel · Build & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: panel/backend/node_modules
          key: ${{ runner.os }}-panel-backend-${{ hashFiles('panel/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-panel-backend-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: panel/frontend/node_modules
          key: ${{ runner.os }}-panel-frontend-${{ hashFiles('panel/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-panel-frontend-

      - name: Build backend
        working-directory: panel/backend
        run: npm ci && npm run build

      - name: Build frontend
        working-directory: panel/frontend
        run: npm ci && npm run build

      - name: Set lowercase owner
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push panel-backend
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./panel/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/panel-backend:latest
            ghcr.io/${{ env.OWNER }}/panel-backend:${{ github.sha }}

      - name: Build & push panel-frontend
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./panel/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/panel-frontend:latest
            ghcr.io/${{ env.OWNER }}/panel-frontend:${{ github.sha }}

  # ─── Deploy al VPS (sólo en main, tras publicar imágenes) ───────────────────
  deploy:
    name: Deploy · Panel VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "panel/infra/docker-compose.prod.yml"
          target: /home/manu/panel
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            mkdir -p /home/manu/panel
            cd /home/manu/panel

            # Cargar variable de entorno con la contraseña de Keycloak admin
            export KEYCLOAK_ADMIN_PASSWORD="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}"

            # Parar y eliminar contenedores existentes
            docker stop panel-frontend panel-backend 2>/dev/null || true
            docker rm   panel-frontend panel-backend 2>/dev/null || true

            # Descargar las últimas imágenes
            docker compose -f docker-compose.prod.yml pull

            # Iniciar / recrear contenedores con las nuevas imágenes
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Verificar estado
            docker compose -f docker-compose.prod.yml ps

            # Limpiar imágenes antiguas
            docker image prune -f
