name: CI/CD Viajes

on:
  push:
    branches:
      - main
    paths:
      - 'viajes/**'
      - '.github/workflows/viajes-ci.yml'

jobs:
  lint-and-build-backend:
    name: Viajes · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: viajes/backend
        run: npm ci && npm run build

      - name: Test
        working-directory: viajes/backend
        run: npm test

  lint-and-build-frontend:
    name: Viajes · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: viajes/frontend
        run: npm ci && npm run build

      - name: Test
        working-directory: viajes/frontend
        run: npm test

  docker-build-and-push:
    name: Viajes · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push viajes-backend
        uses: docker/build-push-action@v5
        with:
          context: ./viajes/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/viajes-backend:latest
            ghcr.io/${{ env.OWNER }}/viajes-backend:${{ github.sha }}

      - name: Build & push viajes-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./viajes/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/viajes-frontend:latest
            ghcr.io/${{ env.OWNER }}/viajes-frontend:${{ github.sha }}

  deploy:
    name: Deploy · Viajes VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose e init.sql al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "viajes/infra/docker-compose.prod.yml,viajes/infra/init.sql"
          target: /home/manu/viajes
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/viajes

            docker compose -f docker-compose.prod.yml pull viajes-backend viajes-frontend
            docker compose -f docker-compose.prod.yml up -d viajes-db viajes-backend viajes-frontend
            docker compose -f docker-compose.prod.yml ps
