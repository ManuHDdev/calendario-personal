name: CI/CD Calendario

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write   # necesario para publicar en GHCR

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend · Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        working-directory: backend
        run: mvn clean verify -B

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-test-report
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: calendario-frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('calendario-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: calendario-frontend
        run: npm ci --legacy-peer-deps

      - name: Build production
        working-directory: calendario-frontend
        run: npx ng build --configuration production

      - name: Run unit tests
        working-directory: calendario-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # ─── Docker Build & Push (sólo en main) ─────────────────────────────────────
  docker-publish:
    name: Docker · Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/manuhddev/calendario-backend:latest
            ghcr.io/manuhddev/calendario-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./calendario-frontend
          push: true
          tags: |
            ghcr.io/manuhddev/calendario-frontend:latest
            ghcr.io/manuhddev/calendario-frontend:${{ github.sha }}

  # ─── Deploy al VPS (sólo en main, tras publicar imágenes) ───────────────────
  deploy:
    name: Deploy · VPS
    runs-on: ubuntu-latest
    needs: [docker-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar ficheros de infra al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/docker-compose.prod.yml,infra/keycloak/realm-export.prod.json,nginx/calendario.conf"
          target: /home/manu/calendario
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Mover keycloak realm a la ruta correcta
            mkdir -p /home/manu/calendario/infra/keycloak
            if [ -f /home/manu/calendario/infra/keycloak/realm-export.prod.json ]; then
              cp /home/manu/calendario/infra/keycloak/realm-export.prod.json \
                 /home/manu/calendario/infra/keycloak/realm-export.json
            fi

            cd /home/manu/calendario/infra

            # Asegurar que la red existe (idempotente)
            docker network create calendario-net 2>/dev/null || true

            # Parar y eliminar contenedores existentes con estos nombres
            # (maneja el caso de que existan con un label de proyecto diferente)
            docker stop calendario-postgres calendario-keycloak calendario-backend calendario-frontend 2>/dev/null || true
            docker rm   calendario-postgres calendario-keycloak calendario-backend calendario-frontend 2>/dev/null || true

            # Descargar las últimas imágenes
            docker compose -p calendario -f docker-compose.prod.yml pull

            # Iniciar los servicios con las nuevas imágenes
            docker compose -p calendario -f docker-compose.prod.yml up -d

            # Publicar nuestra config de nginx en la carpeta compartida (un archivo
            # por proyecto — nunca tocar los de otros dominios que viven ahí mismo)
            mkdir -p /home/manu/nginx-shared/conf.d
            cp /home/manu/calendario/nginx/calendario.conf \
               /home/manu/nginx-shared/conf.d/elbunkerdelingeniero.conf

            # Validar sintaxis antes de recargar; si falla, no tocar nginx
            docker exec atg-app-nginx-1 nginx -t && \
              docker exec atg-app-nginx-1 nginx -s reload || \
              echo "AVISO: nginx -t falló, no se recargó — revisar /home/manu/nginx-shared/conf.d/elbunkerdelingeniero.conf"

            # Limpiar imágenes antiguas
            docker image prune -f

  # ─── Jira · Cerrar ticket al merge en main ──────────────────────────────────
  jira-transition:
    name: Jira · Cerrar ticket
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true

    steps:
      - name: Extraer clave Jira del nombre de rama
        id: jira
        run: |
          ISSUE_KEY=$(echo '${{ github.event.head_commit.message }}' | grep -oP 'CAL-\d+' | head -1)
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Detectado: $ISSUE_KEY"

      - name: Transicionar a Listo en Jira
        if: steps.jira.outputs.issue_key != ''
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Basic $(echo -n '${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}' | base64)" \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"31"}}' \
            "https://manuhddev.atlassian.net/rest/api/3/issue/${{ steps.jira.outputs.issue_key }}/transitions"
