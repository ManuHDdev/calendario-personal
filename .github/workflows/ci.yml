name: CI/CD Calendario

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend · Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        working-directory: backend
        run: mvn clean verify -B

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-test-report
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: calendario-frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('calendario-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: calendario-frontend
        run: npm ci --legacy-peer-deps

      - name: Build production
        working-directory: calendario-frontend
        run: npx ng build --configuration production

      - name: Run unit tests
        working-directory: calendario-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # ─── SonarQube ──────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    continue-on-error: true

    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Analyze with SonarQube
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn clean verify sonar:sonar -B \
            -Dsonar.projectKey=calendario \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  # ─── Docker Build ───────────────────────────────────────────────────────────
  docker-build:
    name: Docker · Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t calendario-backend ./backend

      - name: Build frontend image
        run: docker build -t calendario-frontend ./calendario-frontend

  # ─── Jira · Cerrar ticket al merge en main ──────────────────────────────────
  jira-transition:
    name: Jira · Cerrar ticket
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Solo en push a main (merge de PR o commit directo)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Extraer clave Jira del nombre de rama
        id: jira
        run: |
          # El nombre de la rama que se mergeó viene en el mensaje del merge commit
          # o bien en la ref del head del PR. Buscamos patrón CAL-\d+ en el mensaje.
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          ISSUE_KEY=$(echo "$COMMIT_MSG" | grep -oP "CAL-\d+" | head -1)
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Detectado: $ISSUE_KEY"

      - name: Transicionar a Listo en Jira
        if: steps.jira.outputs.issue_key != ''
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Basic $(echo -n '${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}' | base64)" \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"31"}}' \
            "https://manuhddev.atlassian.net/rest/api/3/issue/${{ steps.jira.outputs.issue_key }}/transitions"
