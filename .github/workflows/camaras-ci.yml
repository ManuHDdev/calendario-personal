name: CI/CD Cámaras

on:
  push:
    branches:
      - main
    paths:
      - 'camaras/**'
      - '.github/workflows/camaras-ci.yml'

jobs:
  lint-and-build-backend:
    name: Cámaras · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: camaras/backend
        run: npm ci && npm run build

      - name: Test
        working-directory: camaras/backend
        run: npm test

  lint-and-build-frontend:
    name: Cámaras · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: camaras/frontend
        run: npm ci

      - name: Test
        working-directory: camaras/frontend
        run: npm test

      - name: Build
        working-directory: camaras/frontend
        run: npm run build

  docker-build-and-push:
    name: Cámaras · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push camaras-backend
        uses: docker/build-push-action@v5
        with:
          context: ./camaras/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/camaras-backend:latest
            ghcr.io/${{ env.OWNER }}/camaras-backend:${{ github.sha }}

      - name: Build & push camaras-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./camaras/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/camaras-frontend:latest
            ghcr.io/${{ env.OWNER }}/camaras-frontend:${{ github.sha }}

  deploy:
    name: Deploy · Cámaras VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose e init.sql al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "camaras/infra/docker-compose.prod.yml,camaras/infra/init.sql"
          target: /home/manu/camaras
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/camaras

            docker compose -f docker-compose.prod.yml pull camaras-backend camaras-frontend
            docker compose -f docker-compose.prod.yml up -d camaras-db camaras-backend camaras-frontend
            docker compose -f docker-compose.prod.yml ps
