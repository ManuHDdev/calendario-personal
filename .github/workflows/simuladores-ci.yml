name: CI/CD Simuladores

on:
  push:
    branches:
      - main
    paths:
      - 'simuladores/**'
      - '.github/workflows/simuladores-ci.yml'

jobs:
  # ─── 1. Build & test frontend ────────────────────────────────────────────────
  lint-and-build-frontend:
    name: Simuladores · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: simuladores/frontend
        run: npm ci

      # La lógica de los simuladores (permutaciones, probabilidades teóricas,
      # Montecarlo con semilla fija, RK4…) son funciones puras: los tests
      # corren enteramente en CI sin red ni base de datos.
      - name: Test
        working-directory: simuladores/frontend
        run: npm test

      - name: Build
        working-directory: simuladores/frontend
        run: npm run build

  # ─── 2. Docker build & push to GHCR ─────────────────────────────────────────
  docker-build-and-push:
    name: Simuladores · Docker build & push
    runs-on: ubuntu-latest
    needs: lint-and-build-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push simuladores-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./simuladores/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/simuladores-frontend:latest
            ghcr.io/${{ env.OWNER }}/simuladores-frontend:${{ github.sha }}

  # ─── 3. Deploy al VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy · Simuladores VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "simuladores/infra/docker-compose.prod.yml"
          target: /home/manu/simuladores
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/simuladores

            docker compose -f docker-compose.prod.yml pull simuladores-frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps simuladores-frontend
            docker compose -f docker-compose.prod.yml ps

            # El bloque `location /simuladores/` de nginx vive en
            # nginx/calendario.conf y lo despliega el pipeline de Calendario
            # (.github/workflows/ci.yml), no este workflow.
