name: CI/CD Paraísos

on:
  push:
    branches:
      - main
    paths:
      - 'paraisos/**'
      - '.github/workflows/paraisos-ci.yml'

jobs:
  lint-and-build-backend:
    name: Paraísos · Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: paraisos/backend
        run: npm ci && npm run build

  lint-and-build-frontend:
    name: Paraísos · Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        working-directory: paraisos/frontend
        run: npm ci && npm run build

  docker-build-and-push:
    name: Paraísos · Docker build & push
    runs-on: ubuntu-latest
    needs: [lint-and-build-backend, lint-and-build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push paraisos-backend
        uses: docker/build-push-action@v5
        with:
          context: ./paraisos/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/paraisos-backend:latest
            ghcr.io/${{ env.OWNER }}/paraisos-backend:${{ github.sha }}

      - name: Build & push paraisos-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./paraisos/frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/paraisos-frontend:latest
            ghcr.io/${{ env.OWNER }}/paraisos-frontend:${{ github.sha }}

  deploy:
    name: Deploy · Paraísos VPS
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose e init.sql al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "paraisos/infra/docker-compose.prod.yml,paraisos/infra/init.sql"
          target: /home/manu/paraisos
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.216.88.165
          port: 2269
          username: manu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/manu/paraisos

            docker compose -f docker-compose.prod.yml pull paraisos-backend paraisos-frontend
            docker compose -f docker-compose.prod.yml up -d paraisos-db paraisos-backend paraisos-frontend
            docker compose -f docker-compose.prod.yml ps
