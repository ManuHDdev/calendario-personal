services:
  reparto-db:
    image: postgres:15
    container_name: reparto-db-local
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: reparto
      POSTGRES_USER: reparto
      POSTGRES_PASSWORD: reparto123
    volumes:
      - reparto_local_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reparto -d reparto"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  reparto_local_data:
