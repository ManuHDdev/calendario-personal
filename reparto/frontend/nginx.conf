server {
    listen 80;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://reparto-backend:3010;

    location /reparto/api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reparto/ {
        alias /usr/share/nginx/html/reparto/;
        try_files $uri $uri/ /reparto/index.html;
    }
}
