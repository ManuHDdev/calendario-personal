server {
    listen 80;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://camaras-backend:3017;

    # Sin access_log: las imágenes de cámara se piden con el access token de
    # Keycloak en ?token= (un <img> no puede mandar cabeceras) y no debe quedar en logs.
    location /camaras/api/ {
        proxy_pass $backend_upstream;
        access_log off;
        proxy_read_timeout 90s;   # POST /importacion descarga y parsea el feed entero
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /camaras/ {
        alias /usr/share/nginx/html/camaras/;
        try_files $uri $uri/ /camaras/index.html;
    }
}
