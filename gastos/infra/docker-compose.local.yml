# ─────────────────────────────────────────────────────────────────────────────
# gastos — Base de datos PostgreSQL para desarrollo local
# Puerto expuesto: 5435 en localhost (5433 calendario, 5434 mapacyd, libre 5435)
# El backend de gastos se conecta via localhost:5435, no necesita red compartida.
# Uso: gestionado automáticamente por start-local.sh
# ─────────────────────────────────────────────────────────────────────────────

services:
  gastos-db:
    image: postgres:15
    container_name: gastos-db-local
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos123
    volumes:
      - gastos_local_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  gastos_local_data:
