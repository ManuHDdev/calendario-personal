<div class="dialog-container">
  <h2 class="dialog-titulo">{{ data.title }}</h2>
  <p class="dialog-mensaje">{{ data.message }}</p>
  <div class="dialog-acciones">
    <button class="btn-cancelar" type="button" (click)="cancel()">Cancelar</button>
    <button class="btn-confirmar" type="button" (click)="confirm()">Eliminar</button>
  </div>
</div>
