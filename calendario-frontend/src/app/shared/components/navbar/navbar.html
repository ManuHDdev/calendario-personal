<nav class="navbar">
  <a class="navbar__brand" routerLink="/calendario">Calendario</a>

  <div class="navbar__actions">
    <a class="navbar__new-event" routerLink="/eventos/nuevo" aria-label="Nuevo evento">
      <span class="navbar__new-event-icon" aria-hidden="true">+</span>
      <span class="navbar__new-event-label">+ Nuevo evento</span>
    </a>

    <app-theme-toggle />

    <app-app-launcher />

    @if (authService.isAdmin()) {
      <a class="navbar__username navbar__username--admin" [href]="panelUrl" title="Ir al Panel de administración">
        {{ authService.getUserName() }}
      </a>
    } @else {
      <span class="navbar__username">{{ authService.getUserName() }}</span>
    }

    <button class="navbar__logout" type="button" (click)="logout()">Cerrar sesión</button>
  </div>
</nav>
