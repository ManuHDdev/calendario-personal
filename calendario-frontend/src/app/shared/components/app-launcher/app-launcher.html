<div class="launcher">
  <button
    class="launcher__btn"
    [class.launcher__btn--activo]="abierto()"
    (click)="toggle()"
    title="Aplicaciones"
    type="button"
  >
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
      <rect x="3"  y="3"  width="4" height="4" rx="1"/>
      <rect x="10" y="3"  width="4" height="4" rx="1"/>
      <rect x="17" y="3"  width="4" height="4" rx="1"/>
      <rect x="3"  y="10" width="4" height="4" rx="1"/>
      <rect x="10" y="10" width="4" height="4" rx="1"/>
      <rect x="17" y="10" width="4" height="4" rx="1"/>
      <rect x="3"  y="17" width="4" height="4" rx="1"/>
      <rect x="10" y="17" width="4" height="4" rx="1"/>
      <rect x="17" y="17" width="4" height="4" rx="1"/>
    </svg>
  </button>

  @if (abierto()) {
    <div class="launcher__panel">
      <div class="launcher__grid">
        @for (app of apps; track app.id) {
          <a class="launcher__app" [href]="app.url">
            <span class="launcher__icono" [style.background]="app.color">
              @switch (app.id) {
                @case ('calendario') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <rect x="3" y="4" width="18" height="18" rx="3"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                  </svg>
                }
                @case ('storage') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                  </svg>
                }
                @case ('mapacyd') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                    <circle cx="12" cy="9" r="2.5"/>
                  </svg>
                }
                @case ('panel') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                  </svg>
                }
                @case ('ytdl') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <path d="M12 3v12"/>
                    <path d="M7 10l5 5 5-5"/>
                    <path d="M4 19h16"/>
                  </svg>
                }
                @case ('gastos') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
                    <path d="M16 12h3a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3a2 2 0 0 1 0-4z"/>
                  </svg>
                }
                @case ('ofertas') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <path d="M20.59 13.41 12 22l-9-9V3h10l7.59 7.59a2 2 0 0 1 0 2.82z"/>
                    <circle cx="7.5" cy="7.5" r="1.5" fill="white" stroke="none"/>
                  </svg>
                }
                @case ('paraisos') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <path d="M2 22l1-1h18l1 1"/>
                    <path d="M12 13V2"/>
                    <path d="M12 2c-3 4-7 5.5-7 8.5S8 16 12 13"/>
                    <path d="M12 2c3 4 7 5.5 7 8.5S16 16 12 13"/>
                  </svg>
                }
                @case ('juegos') {
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
                    <rect x="2" y="7" width="20" height="10" rx="5"/>
                    <line x1="7" y1="12" x2="7" y2="12.01"/>
                    <line x1="6" y1="10.5" x2="6" y2="13.5"/>
                    <line x1="4.5" y1="12" x2="7.5" y2="12"/>
                    <circle cx="16" cy="10.5" r="1" fill="white" stroke="none"/>
                    <circle cx="18" cy="13" r="1" fill="white" stroke="none"/>
                  </svg>
                }
              }
            </span>
            <span class="launcher__nombre">{{ app.nombre }}</span>
          </a>
        }
      </div>
    </div>
  }
</div>
