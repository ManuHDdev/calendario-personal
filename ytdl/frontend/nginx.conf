server {
    listen 80;

    location /ytdl/api/download {
        proxy_pass http://ytdl-backend:3004/ytdl/api/download;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La respuesta se stremea sin Content-Length: no debe bufferizarse.
        proxy_buffering off;
        proxy_read_timeout 630s;
        proxy_send_timeout 630s;
    }

    location /ytdl/api/ {
        proxy_pass http://ytdl-backend:3004/ytdl/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ytdl/ {
        alias /usr/share/nginx/html/ytdl/;
        try_files $uri $uri/ /ytdl/index.html;
    }
}
