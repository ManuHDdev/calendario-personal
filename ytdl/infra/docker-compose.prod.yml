networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  ytdl-backend:
    image: ghcr.io/manuhddev/ytdl-backend:latest
    container_name: ytdl-backend
    restart: unless-stopped
    networks:
      - calendario-net
    environment:
      KEYCLOAK_CERTS_URL: http://calendario-keycloak:8080/keycloak/realms/calendario/protocol/openid-connect/certs
      CORS_ORIGIN: https://elbunkerdelingeniero.duckdns.org
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/ytdl/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  ytdl-frontend:
    image: ghcr.io/manuhddev/ytdl-frontend:latest
    container_name: ytdl-frontend
    restart: unless-stopped
    networks:
      - calendario-net
    depends_on:
      - ytdl-backend
