server {
    listen 80;

    location /pisos/api/ {
        proxy_pass http://pisos-backend:3012/pisos/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un rastreo manual llama a tres portales, con varias páginas cada
        # uno: muy por encima de los 60s por defecto de nginx.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /pisos/ {
        alias /usr/share/nginx/html/pisos/;
        try_files $uri $uri/ /pisos/index.html;
    }
}
