networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  pisos-db:
    image: postgres:15
    container_name: pisos-db
    environment:
      POSTGRES_DB:       ${PISOS_DB_NAME}
      POSTGRES_USER:     ${PISOS_DB_USER}
      POSTGRES_PASSWORD: ${PISOS_DB_PASSWORD}
    volumes:
      - pisos_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PISOS_DB_USER} -d ${PISOS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calendario-net

  pisos-backend:
    image: ghcr.io/manuhddev/pisos-backend:latest
    container_name: pisos-backend
    environment:
      PORT:                 3012
      PISOS_DB_HOST:        pisos-db
      PISOS_DB_NAME:        ${PISOS_DB_NAME}
      PISOS_DB_USER:        ${PISOS_DB_USER}
      PISOS_DB_PASSWORD:    ${PISOS_DB_PASSWORD}
      KEYCLOAK_CERTS_URL:   ${KEYCLOAK_CERTS_URL}
      CORS_ORIGIN:          ${CORS_ORIGIN}
      # El rastreador vive dentro de este contenedor: con restart
      # unless-stopped, vigila solo mientras el VPS esté en pie.
      PISOS_INTERVALO_MINUTOS:  ${PISOS_INTERVALO_MINUTOS:-15}
      PISOS_PAGINAS_POR_PORTAL: ${PISOS_PAGINAS_POR_PORTAL:-2}
      TELEGRAM_BOT_TOKEN:       ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_CHAT_ID:   ${TELEGRAM_OWNER_CHAT_ID}
      NODE_ENV:             production
    depends_on:
      pisos-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3012/pisos/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - calendario-net

  pisos-frontend:
    image: ghcr.io/manuhddev/pisos-frontend:latest
    container_name: pisos-frontend
    depends_on:
      - pisos-backend
    restart: unless-stopped
    networks:
      - calendario-net

volumes:
  pisos_pgdata:
