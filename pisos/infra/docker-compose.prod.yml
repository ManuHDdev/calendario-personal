# Las tres variables de base de datos van con `:?` porque no tienen valor por
# defecto posible: sin contrasena, Postgres se niega a inicializarse y lo unico
# que se ve es "pisos-db is unhealthy", que no dice nada. Con `:?`, compose
# aborta al instante nombrando la que falta.
#
# El resto NO lleva `:?` a proposito: KEYCLOAK_CERTS_URL y CORS_ORIGIN traen su
# valor de produccion aqui mismo con `:-`, y sin las de Telegram el rastreador
# funciona igual, solo se queda sin avisos.
networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  pisos-db:
    image: postgres:15
    container_name: pisos-db
    environment:
      POSTGRES_DB:       "${PISOS_DB_NAME:?falta PISOS_DB_NAME en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)}"
      POSTGRES_USER:     "${PISOS_DB_USER:?falta PISOS_DB_USER en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)}"
      POSTGRES_PASSWORD: "${PISOS_DB_PASSWORD:?falta PISOS_DB_PASSWORD en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)}"
    volumes:
      - pisos_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PISOS_DB_USER:?falta PISOS_DB_USER en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)} -d ${PISOS_DB_NAME:?falta PISOS_DB_NAME en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calendario-net

  pisos-backend:
    image: ghcr.io/manuhddev/pisos-backend:latest
    container_name: pisos-backend
    environment:
      PORT:                 3012
      PISOS_DB_HOST:        pisos-db
      PISOS_DB_NAME:        "${PISOS_DB_NAME:?falta PISOS_DB_NAME en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)}"
      PISOS_DB_USER:        "${PISOS_DB_USER:?falta PISOS_DB_USER en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)}"
      PISOS_DB_PASSWORD:    "${PISOS_DB_PASSWORD:?falta PISOS_DB_PASSWORD en /home/manu/pisos/.env (ver DEPLOY_NOTES.md)}"
      KEYCLOAK_CERTS_URL:   ${KEYCLOAK_CERTS_URL:-http://calendario-keycloak:8080/keycloak/realms/calendario/protocol/openid-connect/certs}
      CORS_ORIGIN:          ${CORS_ORIGIN:-https://elbunkerdelingeniero.duckdns.org}
      # El rastreador vive dentro de este contenedor: con restart
      # unless-stopped, vigila solo mientras el VPS esté en pie.
      PISOS_INTERVALO_MINUTOS:  ${PISOS_INTERVALO_MINUTOS:-15}
      PISOS_PAGINAS_POR_PORTAL: ${PISOS_PAGINAS_POR_PORTAL:-2}
      TELEGRAM_BOT_TOKEN:       ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_CHAT_ID:   ${TELEGRAM_OWNER_CHAT_ID}
      NODE_ENV:             production
    depends_on:
      pisos-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3012/pisos/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - calendario-net

  pisos-frontend:
    image: ghcr.io/manuhddev/pisos-frontend:latest
    container_name: pisos-frontend
    depends_on:
      - pisos-backend
    restart: unless-stopped
    networks:
      - calendario-net

volumes:
  pisos_pgdata:
