server {
    listen 80;

    # WebSocket de salas en vivo — necesita las cabeceras Upgrade/Connection
    # en cada salto del proxy (aquí y en nginx/calendario.conf) para que la
    # conexión no se quede en un simple HTTP/1.1 sin upgrade.
    location /juegos/api/ws {
        proxy_pass http://juegos-backend:3008/juegos/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /juegos/api/ {
        proxy_pass http://juegos-backend:3008/juegos/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /juegos/ {
        alias /usr/share/nginx/html/juegos/;
        try_files $uri $uri/ /juegos/index.html;
    }
}
