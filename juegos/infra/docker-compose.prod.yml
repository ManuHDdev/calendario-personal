networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  juegos-backend:
    image: ghcr.io/manuhddev/juegos-backend:latest
    container_name: juegos-backend
    restart: unless-stopped
    networks:
      - calendario-net
    environment:
      KEYCLOAK_CERTS_URL: http://calendario-keycloak:8080/keycloak/realms/calendario/protocol/openid-connect/certs
      CORS_ORIGIN: https://elbunkerdelingeniero.duckdns.org
      PORT: 3008
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3008/juegos/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  juegos-frontend:
    image: ghcr.io/manuhddev/juegos-frontend:latest
    container_name: juegos-frontend
    restart: unless-stopped
    networks:
      - calendario-net
    depends_on:
      - juegos-backend
