server {
    listen 80;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://locales-backend:3013;

    location /locales/api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un rastreo manual llama a varios portales, y una comprobación de
        # viabilidad puede salir al motor de rutas: muy por encima de los 60s
        # por defecto de nginx.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /locales/ {
        alias /usr/share/nginx/html/locales/;
        try_files $uri $uri/ /locales/index.html;
    }
}
