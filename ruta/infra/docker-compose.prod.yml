networks:
  calendario-net:
    external: true
    name: calendario-net

services:
  ruta-db:
    image: postgres:15
    container_name: ruta-db
    environment:
      POSTGRES_DB:       ${RUTA_DB_NAME}
      POSTGRES_USER:     ${RUTA_DB_USER}
      POSTGRES_PASSWORD: ${RUTA_DB_PASSWORD}
    volumes:
      - ruta_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUTA_DB_USER} -d ${RUTA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calendario-net

  ruta-backend:
    image: ghcr.io/manuhddev/ruta-backend:latest
    container_name: ruta-backend
    environment:
      PORT:              3011
      RUTA_DB_HOST:      ruta-db
      RUTA_DB_NAME:      ${RUTA_DB_NAME}
      RUTA_DB_USER:      ${RUTA_DB_USER}
      RUTA_DB_PASSWORD:  ${RUTA_DB_PASSWORD}
      KEYCLOAK_CERTS_URL: ${KEYCLOAK_CERTS_URL}
      CORS_ORIGIN:       ${CORS_ORIGIN}
      ORS_API_KEY:       ${ORS_API_KEY}
      NODE_ENV:          production
    depends_on:
      ruta-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/ruta/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - calendario-net

  ruta-frontend:
    image: ghcr.io/manuhddev/ruta-frontend:latest
    container_name: ruta-frontend
    depends_on:
      - ruta-backend
    restart: unless-stopped
    networks:
      - calendario-net

volumes:
  ruta_pgdata:
