services:
  ruta-db:
    image: postgres:15
    container_name: ruta-db-local
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: ruta
      POSTGRES_USER: ruta
      POSTGRES_PASSWORD: ruta123
    volumes:
      - ruta_local_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruta -d ruta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ruta_local_data:
