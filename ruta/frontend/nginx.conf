server {
    listen 80;

    location /ruta/api/ {
        proxy_pass http://ruta-backend:3011/ruta/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A corridor search fans out to dozens of upstream calls, so it needs
        # more headroom than nginx's 60s default.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ruta/ {
        alias /usr/share/nginx/html/ruta/;
        try_files $uri $uri/ /ruta/index.html;
    }
}
