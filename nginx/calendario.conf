# ─────────────────────────────────────────────────────────────────────────────
# Virtualhost: elbunkerdelingeniero.duckdns.org
#
# Este fichero es propiedad exclusiva de este proyecto. El pipeline de deploy
# lo sube a /home/manu/nginx-shared/conf.d/elbunkerdelingeniero.conf en el
# servidor — una carpeta compartida montada (read-only) en el contenedor nginx
# de ATG (ghcr.io/manuhddev/atg-frontend), pero cuyo CONTENIDO no pertenece a
# ATG. Un deploy de ATG nunca debe poder sobrescribir este archivo, y un
# deploy de este proyecto nunca debe tocar los de otros dominios (atg.conf,
# bodasm.conf, muebleshorrillo.conf) que viven en esa misma carpeta.
# ─────────────────────────────────────────────────────────────────────────────

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name elbunkerdelingeniero.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name elbunkerdelingeniero.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/elbunkerdelingeniero.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elbunkerdelingeniero.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_calendario:10m;

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=10s;

    # ── Keycloak (/keycloak/) ──────────────────────────────────────────────
    location /keycloak/ {
        set $svc_cal_kc http://calendario-keycloak:8080;
        proxy_pass         $svc_cal_kc;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    location = /vine-bot { return 301 /vine-bot/; }

    # vine-bot: Telegram + API para subida de fotos/videos de reseñas Amazon Vine
    location /vine-bot/ {
        set $svc_vinebot http://vine-bot:8092;
        rewrite ^/vine-bot/(.*) /$1 break;
        proxy_pass         $svc_vinebot;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend API (/api/) ────────────────────────────────────────────────
    location /api/ {
        set $svc_cal_api http://calendario-backend:8081;
        proxy_pass         $svc_cal_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Uploads estáticos (/uploads/) ─────────────────────────────────────
    location /uploads/ {
        set $svc_cal_uploads http://calendario-backend:8081;
        proxy_pass         $svc_cal_uploads;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Swagger UI (/swagger-ui/, /v3/api-docs/) ──────────────────────────
    location /swagger-ui/ {
        set $svc_cal_swagger http://calendario-backend:8081;
        proxy_pass         $svc_cal_swagger;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        set $svc_cal_apidocs http://calendario-backend:8081;
        proxy_pass         $svc_cal_apidocs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Storage (/storage/) ────────────────────────────────────────────────
    location /storage/ {
        # Storage es el NAS: sube fotos y vídeos, muy por encima del
        # client_max_body_size 20M global de este server. El backend acepta
        # hasta 500 MB, así que ese es el tope que se aplica aquí.
        client_max_body_size 500M;
        client_body_timeout 300s;
        proxy_send_timeout  300s;
        proxy_read_timeout  300s;
        proxy_request_buffering off;

        set $svc_storage http://storage-frontend:80;
        proxy_pass         $svc_storage;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Panel (/panel/) ────────────────────────────────────────────────────
    location /panel/ {
        set $svc_panel http://panel-frontend:80;
        proxy_pass         $svc_panel;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MapaCYD (/mapacyd/) ────────────────────────────────────────────────
    location /mapacyd/ {
        set $svc_mapacyd http://mapacyd-frontend:80;
        proxy_pass         $svc_mapacyd;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── YouTube Downloader (/ytdl/) ─────────────────────────────────────────
    # La descarga se stremea sin Content-Length: no debe bufferizarse en
    # ningún salto del proxy (ver ytdl/frontend/nginx.conf para el mismo ajuste
    # en el hop siguiente hacia ytdl-backend).
    location /ytdl/api/download {
        set $svc_ytdl_dl http://ytdl-frontend:80;
        proxy_pass         $svc_ytdl_dl;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 630s;
        proxy_send_timeout 630s;
    }

    location /ytdl/ {
        set $svc_ytdl http://ytdl-frontend:80;
        proxy_pass         $svc_ytdl;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Gastos (/gastos/) ───────────────────────────────────────────────────
    location /gastos/ {
        set $svc_gastos http://gastos-frontend:80;
        proxy_pass         $svc_gastos;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Ofertas (/ofertas/) ─────────────────────────────────────────────────
    location /ofertas/ {
        set $svc_ofertas http://ofertas-frontend:80;
        proxy_pass         $svc_ofertas;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Paraísos (/paraisos/) ───────────────────────────────────────────────
    location /paraisos/ {
        set $svc_paraisos http://paraisos-frontend:80;
        proxy_pass         $svc_paraisos;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Juegos (/juegos/) ───────────────────────────────────────────────────
    # WS de salas en vivo: cabeceras Upgrade/Connection en este salto y en el
    # siguiente (ver juegos/frontend/nginx.conf) para que la conexión suba a
    # WebSocket sin quedarse en un simple HTTP/1.1 sin upgrade.
    location /juegos/api/ws {
        set $svc_juegos_ws http://juegos-frontend:80;
        proxy_pass         $svc_juegos_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /juegos/ {
        set $svc_juegos http://juegos-frontend:80;
        proxy_pass         $svc_juegos;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Watchlist (/watchlist/) ─────────────────────────────────────────────
    location /watchlist/ {
        set $svc_watchlist http://watchlist-frontend:80;
        proxy_pass         $svc_watchlist;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Reparto (/reparto/) ─────────────────────────────────────────────────
    location /reparto/ {
        set $svc_reparto http://reparto-frontend:80;
        proxy_pass         $svc_reparto;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Ruta (/ruta/) ───────────────────────────────────────────────────────
    location /ruta/ {
        set $svc_ruta http://ruta-frontend:80;
        proxy_pass         $svc_ruta;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Una busqueda de corredor abre decenas de peticiones a Wallapop, muy
        # por encima de los 60s por defecto de nginx.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ── Pisos (/pisos/) ─────────────────────────────────────────────────────
    location /pisos/ {
        set $svc_pisos http://pisos-frontend:80;
        proxy_pass         $svc_pisos;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Un rastreo manual llama a tres portales con varias paginas cada uno,
        # muy por encima de los 60s por defecto de nginx.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # -- Trader (/trader/) --
    location /trader/ {
        set $svc_trader http://trader-frontend:80;
        proxy_pass         $svc_trader;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend Angular (SPA) ─────────────────────────────────────────────
    location / {
        set $svc_cal http://calendario-frontend:80;
        proxy_pass         $svc_cal;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
