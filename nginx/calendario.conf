# ─────────────────────────────────────────────────────────────────────────────
# Virtualhost: elbunkerdelingeniero.duckdns.org
#
# Este fichero es propiedad exclusiva de este proyecto. El pipeline de deploy
# lo sube a /home/manu/nginx-shared/conf.d/elbunkerdelingeniero.conf en el
# servidor — una carpeta compartida montada (read-only) en el contenedor nginx
# de ATG (ghcr.io/manuhddev/atg-frontend), pero cuyo CONTENIDO no pertenece a
# ATG. Un deploy de ATG nunca debe poder sobrescribir este archivo, y un
# deploy de este proyecto nunca debe tocar los de otros dominios (atg.conf,
# bodasm.conf, muebleshorrillo.conf) que viven en esa misma carpeta.
# ─────────────────────────────────────────────────────────────────────────────

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name elbunkerdelingeniero.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name elbunkerdelingeniero.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/elbunkerdelingeniero.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elbunkerdelingeniero.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_calendario:10m;

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=10s;

    # ── Keycloak (/keycloak/) ──────────────────────────────────────────────
    location /keycloak/ {
        set $svc_cal_kc http://calendario-keycloak:8080;
        proxy_pass         $svc_cal_kc;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    location = /vine-bot { return 301 /vine-bot/; }

    # vine-bot: Telegram + API para subida de fotos/videos de reseñas Amazon Vine
    location /vine-bot/ {
        set $svc_vinebot http://vine-bot:8092;
        rewrite ^/vine-bot/(.*) /$1 break;
        proxy_pass         $svc_vinebot;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend API (/api/) ────────────────────────────────────────────────
    location /api/ {
        set $svc_cal_api http://calendario-backend:8081;
        proxy_pass         $svc_cal_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Uploads estáticos (/uploads/) ─────────────────────────────────────
    location /uploads/ {
        set $svc_cal_uploads http://calendario-backend:8081;
        proxy_pass         $svc_cal_uploads;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Swagger UI (/swagger-ui/, /v3/api-docs/) ──────────────────────────
    location /swagger-ui/ {
        set $svc_cal_swagger http://calendario-backend:8081;
        proxy_pass         $svc_cal_swagger;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        set $svc_cal_apidocs http://calendario-backend:8081;
        proxy_pass         $svc_cal_apidocs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Storage (/storage/) ────────────────────────────────────────────────
    location /storage/ {
        set $svc_storage http://storage-frontend:80;
        proxy_pass         $svc_storage;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Panel (/panel/) ────────────────────────────────────────────────────
    location /panel/ {
        set $svc_panel http://panel-frontend:80;
        proxy_pass         $svc_panel;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MapaCYD (/mapacyd/) ────────────────────────────────────────────────
    location /mapacyd/ {
        set $svc_mapacyd http://mapacyd-frontend:80;
        proxy_pass         $svc_mapacyd;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── YouTube Downloader (/ytdl/) ─────────────────────────────────────────
    # La descarga se stremea sin Content-Length: no debe bufferizarse en
    # ningún salto del proxy (ver ytdl/frontend/nginx.conf para el mismo ajuste
    # en el hop siguiente hacia ytdl-backend).
    location /ytdl/api/download {
        set $svc_ytdl_dl http://ytdl-frontend:80;
        proxy_pass         $svc_ytdl_dl;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 630s;
        proxy_send_timeout 630s;
    }

    location /ytdl/ {
        set $svc_ytdl http://ytdl-frontend:80;
        proxy_pass         $svc_ytdl;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend Angular (SPA) ─────────────────────────────────────────────
    location / {
        set $svc_cal http://calendario-frontend:80;
        proxy_pass         $svc_cal;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
