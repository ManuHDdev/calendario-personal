# ─────────────────────────────────────────────────────────────────────────────
# Virtualhost: elbunkerdelingeniero.duckdns.org
# Este fichero se monta en el contenedor nginx de atg-app:
#   volumes:
#     - /home/manu/calendario/nginx/calendario.conf:/etc/nginx/conf.d/calendario.conf:ro
# Y la red "calendario-net" debe añadirse como external en atg-app/docker-compose.yml.
# ─────────────────────────────────────────────────────────────────────────────

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name elbunkerdelingeniero.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name elbunkerdelingeniero.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/elbunkerdelingeniero.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elbunkerdelingeniero.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15M;

    # ── Keycloak (/keycloak/) ──────────────────────────────────────────────
    location /keycloak/ {
        proxy_pass         http://calendario-keycloak:8180/keycloak/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # ── Backend API (/api/) ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://calendario-backend:8081/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Uploads estáticos (/uploads/) ─────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://calendario-backend:8081/uploads/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Caché larga para archivos subidos
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Swagger UI (/swagger-ui/, /v3/api-docs/) ──────────────────────────
    location /swagger-ui/ {
        proxy_pass         http://calendario-backend:8081/swagger-ui/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass         http://calendario-backend:8081/v3/api-docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend Angular (SPA) ─────────────────────────────────────────────
    location / {
        proxy_pass         http://calendario-frontend:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
