server {
    listen 80;

    location /mensajeria/api/ {
        proxy_pass http://mensajeria-backend:3015/mensajeria/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mensajeria/ {
        alias /usr/share/nginx/html/mensajeria/;
        try_files $uri $uri/ /mensajeria/index.html;
    }
}
