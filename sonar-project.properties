sonar.projectKey=calendario
sonar.projectName=Calendario Personal

# Fuentes y tests
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java

# Binarios compilados
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Cobertura JaCoCo
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Exclusiones (capas sin lógica de negocio)
sonar.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/entity/**,\
  **/enums/**,\
  **/*Application.java,\
  **/*Mapper.java

# Exclusiones de cobertura
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/entity/**,\
  **/enums/**,\
  **/*Application.java,\
  **/*Mapper.java

# Encoding
sonar.sourceEncoding=UTF-8
