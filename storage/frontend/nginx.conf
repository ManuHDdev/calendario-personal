server {
    listen 80;

    location /storage/api/ {
        # El backend acepta hasta 500 MB (BODY_LIMIT en backend/src/index.ts).
        # Sin esta directiva nginx aplicaría su default de 1 MB y devolvería 413
        # en cualquier foto de móvil (.jpg de 3-8 MB, .HEIC de iPhone) antes de
        # que la petición llegase siquiera al backend.
        client_max_body_size 500M;

        # Subir 500 MB lleva minutos: sin esto nginx cortaría a los 60 s por defecto.
        client_body_timeout 300s;
        proxy_send_timeout  300s;
        proxy_read_timeout  300s;

        # Streamear la subida al backend en vez de bufferarla entera en el disco
        # del contenedor del frontend (que no está dimensionado para vídeos).
        proxy_request_buffering off;

        proxy_pass http://storage-backend:3001/storage/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        alias /usr/share/nginx/html/storage/;
        try_files $uri $uri/ /storage/index.html;
    }
}
