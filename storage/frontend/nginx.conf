server {
    listen 80;

    # Resolve the backend per request so container restart/reboot order can't leave a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://storage-backend:3001;

    location /storage/api/ {
        # El backend acepta hasta 2 GB (MAX_UPLOAD_BYTES en
        # backend/src/services/fileService.ts) — un vídeo .mov de iPhone en 4K
        # ronda los 400 MB por minuto. Sin esta directiva nginx aplicaría su
        # default de 1 MB y devolvería 413 hasta con una foto, antes de que la
        # petición llegase siquiera al backend.
        client_max_body_size 2048M;

        # Timeouts de INACTIVIDAD, no de duración total: una subida de 2 GB puede
        # durar lo que haga falta mientras siga llegando cuerpo. Sin ellos nginx
        # cortaría a los 60 s por defecto.
        client_body_timeout 600s;
        proxy_send_timeout  600s;
        proxy_read_timeout  600s;

        # Streamear la subida al backend en vez de bufferarla entera en el disco
        # del contenedor del frontend (que no está dimensionado para vídeos).
        proxy_request_buffering off;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        alias /usr/share/nginx/html/storage/;
        try_files $uri $uri/ /storage/index.html;
    }
}
